name: Build NAS kernel module

# 目标：Redmi K40 Gaming (ares) / MT6893 / Linux 4.14.186
# 手工触发，避免 push 就烧 CI 时长

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支'
        required: true
        default: 'ares-r-oss'
      defconfig:
        description: 'defconfig 名称'
        required: true
        default: 'ares_user_defconfig'
      toolchain:
        description: '工具链（若 gcc 报错再试 clang）'
        required: true
        default: 'gcc'
        type: choice
        options:
          - gcc
          - clang
      clang_url:
        description: 'clang 压缩包 URL（toolchain=clang 时必填）'
        required: false
        default: ''
      build_strategy:
        description: '内核准备策略（首选 prepare）'
        required: true
        default: 'prepare'
        type: choice
        options:
          - prepare
          - vmlinux
          - full

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350        # Actions 上限 360

    env:
      ARCH: arm64
      KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
      MOD_DIR: drivers/misc/nas_drv
      # MTK 源码里有大量 printf 格式串与参数不匹配的遗留代码
      # （drivers/gpu/drm/... 用 %d 打印 __func__、%lx 打印 resource_size_t 等）。
      # 原厂旧编译器只报 warning，GCC 11 + 内核 -Werror 会直接编不过。
      # KCFLAGS 在顶层 Makefile 中以 KBUILD_CFLAGS += $(KCFLAGS) 追加到最后，
      # 因此能覆盖掉前面的 -Werror。
      KCFLAGS: -Wno-error

    steps:
      - name: 检出本仓库（内含 nas_drv/）
        uses: actions/checkout@v4
        with:
          path: src

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            ccache cpio kmod xz-utils rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.kernel_branch }}-${{ inputs.defconfig }}-${{ inputs.toolchain }}
          restore-keys: ccache-

      - name: 拉取内核源码
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            "$KERNEL_REPO" ksrc
          du -sh ksrc
          df -h /

      - name: 准备工具链变量
        id: tc
        run: |
          if [ "${{ inputs.toolchain }}" = "clang" ]; then
            if [ -z "${{ inputs.clang_url }}" ]; then
              echo "::error::toolchain=clang 时必须填 clang_url"
              exit 1
            fi
            mkdir -p clang && curl -sL "${{ inputs.clang_url }}" | tar xz -C clang
            CLANGDIR=$(find clang -maxdepth 2 -name bin -type d | head -1)
            echo "CC=ccache $PWD/$CLANGDIR/clang"          >> $GITHUB_ENV
            echo "CROSS_COMPILE=aarch64-linux-gnu-"        >> $GITHUB_ENV
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"         >> $GITHUB_ENV
          else
            echo "CC=ccache aarch64-linux-gnu-gcc"         >> $GITHUB_ENV
            echo "CROSS_COMPILE=aarch64-linux-gnu-"        >> $GITHUB_ENV
          fi

      - name: 配置 defconfig
        working-directory: ksrc
        run: |
          make O=out ARCH=arm64 ${{ inputs.defconfig }}
          # 关掉调试信息：省磁盘、省时间，不影响符号解析
          scripts/config --file out/.config --disable CONFIG_DEBUG_INFO
          make O=out ARCH=arm64 olddefconfig
          echo "--- 关键配置 ---"
          grep -E 'CONFIG_MODVERSIONS|CONFIG_MODULES|CONFIG_MODULE_SIG=' out/.config || true
          if grep -q '^CONFIG_MODVERSIONS=y' out/.config; then
            echo "::warning::CONFIG_MODVERSIONS=y，prepare 策略可能缺少完整符号表，必要时改用 vmlinux/full"
          fi

      - name: 移除内核树里的 -Werror
        working-directory: ksrc
        run: |
          # 小米/联发科源码自带大量格式串 bug（pr_info 用 %d 打 __func__、
          # %lx 打 resource_size_t 等），在 GCC 11 下被 -Werror 放大成错误，
          # 例如 drivers/gpu/drm/panel/aw2028_led.c、mediatek/mtk_drm_drv.c。
          # 子目录 Makefile 里的 ccflags-y += -Werror 会追加在 KCFLAGS 之后，
          # 单靠 KCFLAGS=-Wno-error 盖不住，故从源头清掉。
          # 先删带参数的（-Werror=xxx），再删裸的，避免残留 "=xxx"。
          FILES=$(grep -rl --include=Makefile --include=Kbuild --include=*.mk \
                       -e '-Werror' . || true)
          if [ -n "$FILES" ]; then
            echo "命中文件："
            echo "$FILES"
            echo "$FILES" | xargs -r perl -pi -e 's/-Werror(=[A-Za-z0-9_-]+)?//g'
          else
            echo "未在 Makefile/Kbuild 中发现 -Werror"
          fi
          echo "--- 复查 ---"
          grep -rn --include=Makefile --include=Kbuild -e '-Werror' . || echo "已清空"

      - name: 准备内核构建环境（prepare，不编任何 .o）
        if: ${{ inputs.build_strategy == 'prepare' }}
        working-directory: ksrc
        run: |
          make O=out ARCH=arm64 modules_prepare
          ls -l out/Module.symvers out/scripts 2>/dev/null || true
          df -h /

      - name: 编译 vmlinux（含 built-in 驱动，较慢）
        if: ${{ inputs.build_strategy == 'vmlinux' }}
        working-directory: ksrc
        run: |
          make O=out ARCH=arm64 -j$(nproc) vmlinux
          ls -lh out/vmlinux
          df -h /

      - name: 编译完整内核（最慢，兜底）
        if: ${{ inputs.build_strategy == 'full' }}
        working-directory: ksrc
        run: |
          make O=out ARCH=arm64 -j$(nproc)
          df -h /

      - name: 放入驱动源码
        run: |
          mkdir -p "ksrc/$MOD_DIR"
          cp src/nas_drv/nas_drv.c src/nas_drv/nas_drv.h src/nas_drv/Kbuild "ksrc/$MOD_DIR/"
          ls -l "ksrc/$MOD_DIR"

      - name: 编译 NAS 模块
        id: mod
        working-directory: ksrc
        run: |
          set +e
          make O=out ARCH=arm64 M="$GITHUB_WORKSPACE/ksrc/$MOD_DIR" modules
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::模块编译失败（rc=$rc）"
            if [ "${{ inputs.build_strategy }}" = "prepare" ]; then
              echo "::error::prepare 策略若报符号/CRC 解析失败，请把 build_strategy 改成 vmlinux 重跑"
            fi
            exit $rc
          fi
          find "$GITHUB_WORKSPACE/ksrc/$MOD_DIR" -name '*.ko' -ls

      - name: 校验 vermagic
        run: |
          KO=$(find "ksrc/$MOD_DIR" -name 'nas_drv.ko' | head -1)
          echo "KO=$KO"
          echo "--- vermagic / 依赖 ---"
          strings "$KO" | grep -E 'vermagic|depends|name=' || true
          echo "$KO" >> $GITHUB_STEP_SUMMARY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: nas_drv-ko-${{ inputs.kernel_branch }}
          path: ksrc/drivers/misc/nas_drv/nas_drv.ko
          if-no-files-found: error
